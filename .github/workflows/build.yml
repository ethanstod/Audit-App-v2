name: Build Windows App

# Triggers on any tag pushed like: git tag v1.0.0 && git push --tags
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller pywebview waitress pillow

      - name: Build with PyInstaller
        run: pyinstaller wh347_audit.spec --clean --noconfirm

      - name: Build installer with Inno Setup
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "WH-347 Audit Engine ${{ github.ref_name }}"
          body: |
            ## Installation

            1. Download **WH347-Audit-Engine-Setup.exe** below
            2. Run the installer and follow the prompts (Next → Next → Install → Finish)
            3. The app will launch automatically after install
            4. A desktop shortcut is created for easy access

            ## Updating the wage determination
            Replace `cleaned_rates.xlsx` in your install folder with your updated file.
            Default location: `C:\Program Files\WH347 Audit Engine\cleaned_rates.xlsx`
          files: dist/WH347-Audit-Engine-Setup.exe
